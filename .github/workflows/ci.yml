name: Public demo validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: bash scripts/ci-gitleaks.sh
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run verify:public
      - run: python -B -m unittest discover -s scripts -p 'test_plan_public_updates.py'
      - run: npm run check:source
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:pages
      - run: npm run build:pages
      - run: npm run verify:pages
